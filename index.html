<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phonics Fun!</title>
    <style>
        body {
            font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f8ff;
            touch-action: manipulation;
        }

        #game-container {
            background-color: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }

        h1 {
            color: #ff6b6b;
            margin-top: 0;
            font-size: 2.5rem;
        }

        #flashcard {
            font-size: 5rem;
            margin: 20px 0;
            cursor: pointer;
            transition: transform 0.2s;
        }

        #flashcard:hover {
            transform: scale(1.1);
        }

        #word-display {
            font-size: 2rem;
            color: #4ecdc4;
            margin-bottom: 20px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .options-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .option-btn {
            font-family: inherit;
            font-size: 2.5rem;
            font-weight: bold;
            width: 70px;
            height: 70px;
            border: none;
            border-radius: 15px;
            background-color: #ffe66d;
            color: #333;
            cursor: pointer;
            box-shadow: 0 5px 0 #f4d03f;
            transition: all 0.1s;
        }

        .option-btn:active {
            transform: translateY(5px);
            box-shadow: 0 0 0 #f4d03f;
        }

        .option-btn.correct {
            background-color: #a8e6cf;
            box-shadow: 0 5px 0 #85c7b0;
            color: white;
        }

        .option-btn.wrong {
            background-color: #ff8b94;
            box-shadow: 0 5px 0 #e06c75;
            color: white;
            animation: shake 0.5s;
        }

        #play-sound-btn {
            font-size: 1.2rem;
            padding: 10px 20px;
            border-radius: 25px;
            border: none;
            background-color: #4ecdc4;
            color: white;
            cursor: pointer;
            box-shadow: 0 4px 0 #3baba2;
            font-family: inherit;
            font-weight: bold;
        }

        #play-sound-btn:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #3baba2;
        }

        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            50% { transform: translateX(5px); }
            75% { transform: translateX(-5px); }
            100% { transform: translateX(0); }
        }

        #feedback-msg {
            height: 30px;
            font-size: 1.2rem;
            font-weight: bold;
            color: #ff6b6b;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <h1>Phonics Fun</h1>
        <p>What is the first letter?</p>
        
        <div id="flashcard" onclick="speakWord()">🍎</div>
        <div id="word-display">_ pple</div>
        
        <div class="options-container" id="options">
            <!-- Buttons will be generated by JS -->
        </div>

        <button id="play-sound-btn" onclick="speakWord()">🔊 Listen</button>
        <div id="feedback-msg"></div>
    </div>

    <script>
        // 파닉스 데이터 (플래시카드용)
        const phonicsData = [
            { word: "apple", emoji: "🍎", firstLetter: "A", options: ["A", "B", "C"] },
            { word: "bear", emoji: "🐻", firstLetter: "B", options: ["P", "B", "D"] },
            { word: "cat", emoji: "🐱", firstLetter: "C", options: ["C", "K", "S"] },
            { word: "dog", emoji: "🐶", firstLetter: "D", options: ["B", "D", "P"] },
            { word: "elephant", emoji: "🐘", firstLetter: "E", options: ["E", "A", "I"] },
            { word: "fish", emoji: "🐟", firstLetter: "F", options: ["V", "P", "F"] }
        ];

        let currentIndex = 0;
        let isSpeaking = false;

        const flashcard = document.getElementById("flashcard");
        const wordDisplay = document.getElementById("word-display");
        const optionsContainer = document.getElementById("options");
        const feedbackMsg = document.getElementById("feedback-msg");

        function loadQuestion() {
            const currentItem = phonicsData[currentIndex];
            flashcard.textContent = currentItem.emoji;
            // 첫 글자를 밑줄로 처리하여 보여줌
            wordDisplay.textContent = "_ " + currentItem.word.substring(1);
            
            optionsContainer.innerHTML = "";
            feedbackMsg.textContent = "";

            // 옵션 버튼 생성
            currentItem.options.forEach(letter => {
                const btn = document.createElement("button");
                btn.className = "option-btn";
                btn.textContent = letter;
                btn.onclick = () => checkAnswer(btn, letter, currentItem.firstLetter);
                optionsContainer.appendChild(btn);
            });

            // 문제 넘어갈 때 자동으로 단어 읽어주기
            speakWord();
        }

        function checkAnswer(btn, selectedLetter, correctLetter) {
            // 이미 정답/오답 클래스가 적용된 버튼은 무시 (중복 클릭 방지)
            if (btn.classList.contains("correct") || btn.classList.contains("wrong")) return;

            if (selectedLetter === correctLetter) {
                btn.classList.add("correct");
                feedbackMsg.textContent = "Excellent! 🎉";
                feedbackMsg.style.color = "#a8e6cf";
                
                // 단어 전체 보여주기
                wordDisplay.textContent = phonicsData[currentIndex].word;
                
                // 정답 맞췄을 때 단어 한 번 더 읽어주기
                speakText(phonicsData[currentIndex].word);

                // 2초 후 다음 문제로
                setTimeout(() => {
                    currentIndex = (currentIndex + 1) % phonicsData.length;
                    loadQuestion();
                }, 2000);
            } else {
                btn.classList.add("wrong");
                feedbackMsg.textContent = "Try again!";
                feedbackMsg.style.color = "#ff8b94";
                speakText(selectedLetter + " is not correct.");
                
                // 1초 후 오답 효과 제거
                setTimeout(() => {
                    btn.classList.remove("wrong");
                    feedbackMsg.textContent = "";
                }, 1000);
            }
        }

        function speakWord() {
            speakText(phonicsData[currentIndex].word);
        }

        function speakText(text) {
            if ('speechSynthesis' in window) {
                // 현재 말하고 있는 중이면 취소
                window.speechSynthesis.cancel();
                
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'en-US';
                utterance.rate = 0.9; // 아이들이 듣기 좋게 약간 느린 속도
                window.speechSynthesis.speak(utterance);
            }
        }

        // 초기화
        loadQuestion();
    </script>
</body>
</html>
